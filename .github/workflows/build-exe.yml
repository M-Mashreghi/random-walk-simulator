name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pyinstaller

      - name: Smoke test (render a picture without a window)
        run: python random_walk.py --save smoke.png

      - name: Build RandomWalk.exe (same script as local builds)
        shell: cmd
        run: build_exe.bat

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RandomWalk-windows
          path: dist/RandomWalk.exe

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Every push to main publishes (or updates) the release named after VERSION.
      # Bump VERSION to publish a new release; pushing a v* tag also works.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: Random Walk Simulator ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows build of the interactive random walk simulator.
            Download `RandomWalk.exe` below and run it. No Python needed.
            Windows SmartScreen may warn because the file is not signed: choose "More info", then "Run anyway".
          files: dist/RandomWalk.exe
