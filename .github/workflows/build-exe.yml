name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pyinstaller

      - name: Smoke test (render a picture without a window)
        run: python random_walk.py --save smoke.png

      - name: Build RandomWalk.exe (same script as local builds)
        shell: cmd
        run: build_exe.bat

      - name: Test the exe (open the real window, close it after 4 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RandomWalk.exe -ArgumentList '--selftest','4' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "RandomWalk.exe did not close within 120 s" }
          if (Test-Path dist\RandomWalk-error.log) { Get-Content dist\RandomWalk-error.log; throw "RandomWalk.exe crashed" }
          if (-not (Test-Path dist\RandomWalk-selftest.txt)) { throw "RandomWalk.exe exited without opening its window (exit code $($p.ExitCode))" }
          $out = Get-Content dist\RandomWalk-selftest.txt
          Write-Host $out
          if ($out -notmatch 'backend=tkagg') { throw "Unexpected backend: $out" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RandomWalk-windows
          path: dist/RandomWalk.exe

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Every push to main publishes (or updates) the release named after VERSION.
      # Bump VERSION to publish a new release; pushing a v* tag also works.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: Random Walk Simulator ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows build of the interactive random walk simulator.
            Download `RandomWalk.exe` below and run it. No Python needed.
            The first start takes 10-20 seconds while Windows unpacks the program.
            Windows SmartScreen may warn because the file is not signed: choose "More info", then "Run anyway".
            If something goes wrong, the error is shown and saved to RandomWalk-error.log next to the exe.
          files: dist/RandomWalk.exe
