name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy matplotlib pyinstaller

      - name: Smoke test (render a picture without a window)
        run: python random_walk.py --save smoke.png

      - name: Build RandomWalk.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name RandomWalk random_walk.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RandomWalk-windows
          path: dist/RandomWalk.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RandomWalk.exe
